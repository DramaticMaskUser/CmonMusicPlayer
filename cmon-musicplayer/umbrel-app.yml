manifestVersion: 1
id: cmon-musicplayer
category: media
name: CmonMusicPlayer
version: "1.0.0"
tagline: A classic brushed-metal jukebox for your music folder
description: >-
  CmonMusicPlayer is a simple, no-nonsense music player that looks and feels
  like the classic iTunes of the early 2000s.


  Point it at a folder in your Umbrel storage and it builds your library,
  rescanning for new music every time it launches. Create playlists, drag songs
  from your Library into them, rate songs, and play everything in order or on
  shuffle - right from your browser.
